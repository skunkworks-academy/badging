name: Deploy Credly Growth Hub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Academy global shell into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = '<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2" data-skunkworks-global-shell="2026.08.15.2"></script>'
          updated = 0
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' in html or 'data-skunkworks-global-shell' in html:
                  continue
              if '</head>' in html:
                  html = html.replace('</head>', f'  {loader}\n</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'  {loader}\n</body>', 1)
              else:
                  continue
              path.write_text(html, encoding='utf-8')
              updated += 1
          print(f'Academy global shell injected into {updated} HTML page(s).')
          PY

      - name: Inject mobile UX assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text()
          if "mobile-ui-fix.css" not in html:
              html = html.replace(
                  "</head>",
                  '  <link rel="stylesheet" href="./mobile-ui-fix.css?v=3">\n  <script defer src="./mobile-ui-fix.js?v=3"></script>\n</head>'
              )
          path.write_text(html)
          PY

      - name: Verify global shell coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          missing = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' not in text and 'data-skunkworks-global-shell' not in text:
                  missing.append(str(path))
          if missing:
              raise SystemExit('Missing Academy global shell: ' + ', '.join(missing))
          print('Verified Academy global shell on every HTML page.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
